<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MathFlux · Gameplay</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  width: 660px; height: 1434px; overflow: hidden;
  font-family: -apple-system, 'SF Pro Display', system-ui, sans-serif;
  background: #080e1c;
}

.canvas {
  width: 660px; height: 1434px; overflow: hidden;
  background: #080e1c;
  display: flex; flex-direction: column; align-items: center;
  position: relative;
}

.bg-glow-tl {
  position: absolute; top: -140px; left: -140px;
  width: 560px; height: 560px;
  background: radial-gradient(circle, rgba(0,212,232,0.2) 0%, transparent 65%);
  pointer-events: none; z-index: 0;
}
.bg-glow-br {
  position: absolute; bottom: -140px; right: -140px;
  width: 560px; height: 560px;
  background: radial-gradient(circle, rgba(255,187,60,0.13) 0%, transparent 65%);
  pointer-events: none; z-index: 0;
}
.bg-grid {
  position: absolute; inset: 0; z-index: 0; opacity: 0.025;
  background-image:
    linear-gradient(rgba(0,212,232,1) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,212,232,1) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
}

.top {
  width: 100%; padding: 52px 48px 0;
  display: flex; flex-direction: column; align-items: center;
  flex-shrink: 0; position: relative; z-index: 1;
}
.badge {
  display: flex; align-items: center; gap: 8px;
  background: rgba(0,212,232,0.1); border: 1px solid rgba(0,212,232,0.25);
  border-radius: 24px; padding: 7px 18px; margin-bottom: 18px;
}
.badge-icon { font-size: 15px; }
.badge-text {
  font-size: 11px; font-weight: 800; letter-spacing: 4px;
  color: #00d4e8; text-transform: uppercase;
}
.headline {
  font-size: 40px; font-weight: 800; color: #fff;
  text-align: center; line-height: 1.14; letter-spacing: -1px;
}
.headline .hl { color: #facc15; }

.device-wrap {
  flex: 1; display: flex; align-items: center; justify-content: center;
  position: relative; z-index: 1; padding: 28px 0;
}

.phone {
  width: 500px; height: 1020px; position: relative;
  background: linear-gradient(155deg, #2a2a30, #1c1c22 45%, #121216);
  border-radius: 60px;
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,0.13),
    0 0 0 1.5px #020205,
    0 0 0 3.5px rgba(255,255,255,0.04),
    0 50px 120px rgba(0,0,0,0.92),
    0 0 120px rgba(250,204,21,0.08);
}
.phone-power {
  position: absolute; right: -4px; top: 260px;
  width: 4px; height: 80px; background: #252530; border-radius: 0 4px 4px 0;
}
.phone-silent {
  position: absolute; left: -4px; top: 170px;
  width: 4px; height: 34px; background: #252530; border-radius: 4px 0 0 4px;
}
.phone-vol-up {
  position: absolute; left: -4px; top: 224px;
  width: 4px; height: 54px; background: #252530; border-radius: 4px 0 0 4px;
}
.phone-vol-down {
  position: absolute; left: -4px; top: 296px;
  width: 4px; height: 54px; background: #252530; border-radius: 4px 0 0 4px;
}

.screen {
  position: absolute; top: 14px; left: 14px; right: 14px; bottom: 14px;
  border-radius: 48px; overflow: hidden; background: #080e1c;
}
.di {
  position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
  width: 140px; height: 38px; background: #000; border-radius: 19px; z-index: 50;
  box-shadow: 0 0 0 1px rgba(255,255,255,0.05);
}

/* ── APP: GAMEPLAY ── */
.app {
  width: 100%; height: 100%;
  background: linear-gradient(180deg, #080e1c 0%, #0b1320 100%);
  display: flex; flex-direction: column;
  padding: 68px 22px 28px;
  position: relative; overflow: hidden;
}
.app-glow-t {
  position: absolute; top: -60px; left: 50%; transform: translateX(-50%);
  width: 400px; height: 300px;
  background: radial-gradient(circle, rgba(0,212,232,0.1) 0%, transparent 70%);
  pointer-events: none;
}

/* Status row */
.status-row {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 18px; flex-shrink: 0;
}
.level-badge {
  background: rgba(0,212,232,0.12); border: 1px solid rgba(0,212,232,0.3);
  border-radius: 10px; padding: 6px 14px;
  font-size: 15px; font-weight: 800; color: #00d4e8;
  font-family: 'Courier New', monospace; letter-spacing: 1px;
}
.score-badge {
  background: rgba(250,204,21,0.1); border: 1px solid rgba(250,204,21,0.25);
  border-radius: 10px; padding: 6px 14px;
  font-size: 15px; font-weight: 800; color: #facc15;
  font-family: 'Courier New', monospace; letter-spacing: 1px;
}

/* Bars */
.bar-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; flex-shrink: 0; }
.bar-row { display: flex; align-items: center; gap: 10px; }
.bar-label { font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.45); width: 42px; flex-shrink: 0; }
.bar-track {
  flex: 1; height: 8px; background: rgba(255,255,255,0.08);
  border-radius: 4px; overflow: hidden;
}
.bar-fill { height: 100%; border-radius: 4px; }
.bar-fill.green { background: linear-gradient(90deg, #22c55e, #16a34a); width: 70%; }
.bar-fill.cyan { background: linear-gradient(90deg, #00d4e8, #0891b2); width: 45%; }
.bar-timer-val {
  font-size: 12px; font-weight: 800; color: #00d4e8;
  font-family: 'Courier New', monospace; width: 26px; text-align: right; flex-shrink: 0;
}

/* Divider */
.divider { height: 1px; background: rgba(255,255,255,0.06); margin: 16px 0; flex-shrink: 0; }

/* Problem area */
.problem-wrap {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; position: relative;
}
.problem-glow {
  position: absolute; width: 320px; height: 200px;
  background: radial-gradient(ellipse, rgba(0,212,232,0.07) 0%, transparent 70%);
  pointer-events: none;
}
.problem {
  font-size: 58px; font-weight: 800; color: #fff;
  font-family: 'Courier New', monospace;
  letter-spacing: -1px; text-align: center;
  text-shadow: 0 0 40px rgba(0,212,232,0.2);
  margin-bottom: 8px;
}
.problem-hint { font-size: 12px; color: rgba(255,255,255,0.3); letter-spacing: 1px; }

/* Answer grid */
.answer-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 12px; margin-top: 16px; flex-shrink: 0;
}
.ans-btn {
  height: 66px; border-radius: 14px;
  background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; font-weight: 800; color: rgba(255,255,255,0.8);
  font-family: 'Courier New', monospace;
}
.ans-btn.active {
  background: rgba(0,212,232,0.1); border: 1.5px solid rgba(0,212,232,0.4);
  color: #00d4e8;
  box-shadow: 0 0 20px rgba(0,212,232,0.15), inset 0 1px 0 rgba(0,212,232,0.1);
}

/* Streak */
.streak-row {
  display: flex; align-items: center; justify-content: center;
  gap: 8px; margin-top: 16px; flex-shrink: 0;
  background: rgba(249,115,22,0.1); border: 1px solid rgba(249,115,22,0.25);
  border-radius: 12px; padding: 10px;
}
.streak-icon { font-size: 18px; }
.streak-text { font-size: 15px; font-weight: 800; color: #f97316; letter-spacing: 0.5px; }

/* home indicator */
.home-ind {
  width: 120px; height: 5px; background: rgba(255,255,255,0.2);
  border-radius: 3px; margin: 14px auto 0; flex-shrink: 0;
}

.bottom {
  width: 100%; flex-shrink: 0; position: relative; z-index: 1;
  display: flex; flex-direction: column; align-items: center;
  padding: 0 48px 50px;
}
.bottom-line {
  width: 60px; height: 2px;
  background: linear-gradient(90deg, transparent, rgba(250,204,21,0.5), transparent);
  margin-bottom: 14px;
}
.tagline { font-size: 13px; color: rgba(255,255,255,0.35); letter-spacing: 0.4px; text-align: center; font-style: normal; }
</style>
</head>
<body>
<div class="canvas">
  <div class="bg-glow-tl"></div>
  <div class="bg-glow-br"></div>
  <div class="bg-grid"></div>

  <div class="top">
    <div class="badge">
      <span class="badge-icon" style="display:inline-flex"><svg width="13" height="13" viewBox="0 0 24 24" fill="#00d4e8" style="display:block"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/></svg></span>
      <span class="badge-text">MathFlux</span>
    </div>
    <div class="headline">Answer Fast.<br><span class="hl">Score Big.</span></div>
  </div>

  <div class="device-wrap">
    <div class="phone">
      <div class="phone-power"></div>
      <div class="phone-silent"></div>
      <div class="phone-vol-up"></div>
      <div class="phone-vol-down"></div>
      <div class="screen">
        <div class="di"></div>
        <div class="app">
          <div class="app-glow-t"></div>

          <div class="status-row">
            <div class="level-badge">L.7</div>
            <div class="score-badge">2,840 pts</div>
          </div>

          <div class="bar-group">
            <div class="bar-row">
              <div class="bar-label">Focus</div>
              <div class="bar-track"><div class="bar-fill green"></div></div>
            </div>
            <div class="bar-row">
              <div class="bar-label">Timer</div>
              <div class="bar-track"><div class="bar-fill cyan"></div></div>
              <div class="bar-timer-val">8s</div>
            </div>
          </div>

          <div class="divider"></div>

          <div class="problem-wrap">
            <div class="problem-glow"></div>
            <div class="problem">247 + 138 = ?</div>
            <div class="problem-hint">TAP YOUR ANSWER</div>
          </div>

          <div class="answer-grid">
            <div class="ans-btn active">375</div>
            <div class="ans-btn">385</div>
            <div class="ans-btn">387</div>
            <div class="ans-btn">395</div>
          </div>

          <div class="streak-row">
            <span class="streak-icon">🔥</span>
            <span class="streak-text">×3 Streak, keep going!</span>
          </div>

          <div class="home-ind"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="bottom">
    <div class="bottom-line"></div>
    <div class="tagline">The math game that gets smarter as you do</div>
  </div>
</div>
</body>
</html>
