<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MathFlux · Adaptive</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  width: 660px; height: 1434px; overflow: hidden;
  font-family: -apple-system, 'SF Pro Display', system-ui, sans-serif;
  background: #080e1c;
}

.canvas {
  width: 660px; height: 1434px; overflow: hidden;
  background: #080e1c;
  display: flex; flex-direction: column; align-items: center;
  position: relative;
}

.bg-glow-tl {
  position: absolute; top: -140px; left: -140px;
  width: 560px; height: 560px;
  background: radial-gradient(circle, rgba(34,197,94,0.15) 0%, transparent 65%);
  pointer-events: none; z-index: 0;
}
.bg-glow-br {
  position: absolute; bottom: -140px; right: -140px;
  width: 560px; height: 560px;
  background: radial-gradient(circle, rgba(0,212,232,0.18) 0%, transparent 65%);
  pointer-events: none; z-index: 0;
}
.bg-grid {
  position: absolute; inset: 0; z-index: 0; opacity: 0.025;
  background-image:
    linear-gradient(rgba(34,197,94,1) 1px, transparent 1px),
    linear-gradient(90deg, rgba(34,197,94,1) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
}

.top {
  width: 100%; padding: 52px 48px 0;
  display: flex; flex-direction: column; align-items: center;
  flex-shrink: 0; position: relative; z-index: 1;
}
.badge {
  display: flex; align-items: center; gap: 8px;
  background: rgba(0,212,232,0.1); border: 1px solid rgba(0,212,232,0.25);
  border-radius: 24px; padding: 7px 18px; margin-bottom: 18px;
}
.badge-icon { font-size: 15px; }
.badge-text {
  font-size: 11px; font-weight: 800; letter-spacing: 4px;
  color: #00d4e8; text-transform: uppercase;
}
.headline {
  font-size: 40px; font-weight: 800; color: #fff;
  text-align: center; line-height: 1.14; letter-spacing: -1px;
}
.headline .hl { color: #22c55e; }

.device-wrap {
  flex: 1; display: flex; align-items: center; justify-content: center;
  position: relative; z-index: 1; padding: 28px 0;
}

.phone {
  width: 500px; height: 1020px; position: relative;
  background: linear-gradient(155deg, #2a2a30, #1c1c22 45%, #121216);
  border-radius: 60px;
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,0.13),
    0 0 0 1.5px #020205,
    0 0 0 3.5px rgba(255,255,255,0.04),
    0 50px 120px rgba(0,0,0,0.92),
    0 0 120px rgba(34,197,94,0.1);
}
.phone-power {
  position: absolute; right: -4px; top: 260px;
  width: 4px; height: 80px; background: #252530; border-radius: 0 4px 4px 0;
}
.phone-silent {
  position: absolute; left: -4px; top: 170px;
  width: 4px; height: 34px; background: #252530; border-radius: 4px 0 0 4px;
}
.phone-vol-up {
  position: absolute; left: -4px; top: 224px;
  width: 4px; height: 54px; background: #252530; border-radius: 4px 0 0 4px;
}
.phone-vol-down {
  position: absolute; left: -4px; top: 296px;
  width: 4px; height: 54px; background: #252530; border-radius: 4px 0 0 4px;
}

.screen {
  position: absolute; top: 14px; left: 14px; right: 14px; bottom: 14px;
  border-radius: 48px; overflow: hidden; background: #080e1c;
}
.di {
  position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
  width: 140px; height: 38px; background: #000; border-radius: 19px; z-index: 50;
  box-shadow: 0 0 0 1px rgba(255,255,255,0.05);
}

/* ── APP: LEVEL UP ── */
.app {
  width: 100%; height: 100%;
  background: linear-gradient(180deg, #080e1c 0%, #071510 60%, #080e1c 100%);
  display: flex; flex-direction: column; align-items: center;
  padding: 72px 26px 30px;
  position: relative; overflow: hidden;
}

/* Concentric glow rings */
.ring {
  position: absolute; border-radius: 50%;
  border: 1px solid rgba(34,197,94,0.12); pointer-events: none;
}
.ring1 { width: 200px; height: 200px; top: 100px; left: 50%; transform: translateX(-50%); }
.ring2 { width: 320px; height: 320px; top: 40px; left: 50%; transform: translateX(-50%); }
.ring3 { width: 440px; height: 440px; top: -20px; left: 50%; transform: translateX(-50%); }

.app-glow-center {
  position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
  width: 380px; height: 380px;
  background: radial-gradient(circle, rgba(34,197,94,0.14) 0%, transparent 65%);
  pointer-events: none;
}

/* ─ Announcement ─ */
.announce-block {
  display: flex; flex-direction: column; align-items: center;
  flex-shrink: 0; position: relative; z-index: 2; margin-top: 20px;
}

.up-circle {
  width: 110px; height: 110px; border-radius: 50%;
  background: radial-gradient(circle, rgba(34,197,94,0.2), rgba(34,197,94,0.06));
  border: 2px solid rgba(34,197,94,0.4);
  display: flex; align-items: center; justify-content: center;
  font-size: 52px; margin-bottom: 24px;
  box-shadow: 0 0 50px rgba(34,197,94,0.2), 0 0 100px rgba(34,197,94,0.08);
}

.level-up-label {
  font-size: 13px; font-weight: 800; letter-spacing: 5px;
  color: rgba(34,197,94,0.7); text-transform: uppercase; margin-bottom: 8px;
}

.level-up-heading {
  font-size: 42px; font-weight: 800; color: #fff;
  letter-spacing: -1px; margin-bottom: 6px;
  text-shadow: 0 0 40px rgba(34,197,94,0.3);
}

.level-num {
  font-size: 72px; font-weight: 800; color: #22c55e;
  font-family: 'Courier New', monospace; line-height: 1;
  text-shadow: 0 0 60px rgba(34,197,94,0.4);
  margin-bottom: 16px;
}

.level-sub {
  font-size: 14px; color: rgba(255,255,255,0.5);
  text-align: center; line-height: 1.5; padding: 0 16px;
}

/* Stats row */
.stats-row {
  display: flex; gap: 0; width: 100%; flex-shrink: 0; margin-top: 32px;
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
  border-radius: 14px; overflow: hidden;
}
.stat-cell {
  flex: 1; padding: 14px 10px; display: flex; flex-direction: column;
  align-items: center; gap: 4px;
}
.stat-cell + .stat-cell { border-left: 1px solid rgba(255,255,255,0.08); }
.stat-val {
  font-size: 20px; font-weight: 800;
  font-family: 'Courier New', monospace;
}
.stat-val.green { color: #22c55e; }
.stat-val.cyan { color: #00d4e8; }
.stat-val.yellow { color: #facc15; }
.stat-lbl { font-size: 10px; color: rgba(255,255,255,0.4); font-weight: 600; }

/* Unlock badge */
.unlock-badge {
  display: flex; align-items: center; gap: 10px; margin-top: 20px; flex-shrink: 0;
  background: rgba(250,204,21,0.1); border: 1px solid rgba(250,204,21,0.3);
  border-radius: 30px; padding: 10px 20px;
}
.unlock-icon { font-size: 16px; }
.unlock-text { font-size: 14px; font-weight: 700; color: #facc15; }

/* Progress to next */
.progress-section { width: 100%; flex-shrink: 0; margin-top: 24px; }
.progress-header {
  display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
}
.progress-lbl { font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.35); letter-spacing: 1px; text-transform: uppercase; }
.progress-pct { font-size: 11px; font-weight: 700; color: rgba(34,197,94,0.7); }
.progress-track {
  width: 100%; height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden;
}
.progress-fill {
  height: 100%; width: 15%; border-radius: 3px;
  background: linear-gradient(90deg, #22c55e, #16a34a);
  box-shadow: 0 0 8px rgba(34,197,94,0.4);
}

.spacer { flex: 1; }

.continue-btn {
  width: 100%; height: 56px; flex-shrink: 0;
  background: linear-gradient(135deg, #22c55e, #16a34a);
  border-radius: 15px; display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 800; color: #000; letter-spacing: 1.5px;
  box-shadow: 0 0 32px rgba(34,197,94,0.3);
}

.home-ind {
  width: 120px; height: 5px; background: rgba(255,255,255,0.2);
  border-radius: 3px; margin: 16px auto 0; flex-shrink: 0;
}

.bottom {
  width: 100%; flex-shrink: 0; position: relative; z-index: 1;
  display: flex; flex-direction: column; align-items: center;
  padding: 0 48px 50px;
}
.bottom-line {
  width: 60px; height: 2px;
  background: linear-gradient(90deg, transparent, rgba(34,197,94,0.5), transparent);
  margin-bottom: 14px;
}
.tagline { font-size: 13px; color: rgba(255,255,255,0.35); letter-spacing: 0.4px; text-align: center; font-style: normal; }
</style>
</head>
<body>
<div class="canvas">
  <div class="bg-glow-tl"></div>
  <div class="bg-glow-br"></div>
  <div class="bg-grid"></div>

  <div class="top">
    <div class="badge">
      <span class="badge-icon" style="display:inline-flex"><svg width="13" height="13" viewBox="0 0 24 24" fill="#00d4e8" style="display:block"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/></svg></span>
      <span class="badge-text">MathFlux</span>
    </div>
    <div class="headline">It Knows When<br><span class="hl">You're Ready</span></div>
  </div>

  <div class="device-wrap">
    <div class="phone">
      <div class="phone-power"></div>
      <div class="phone-silent"></div>
      <div class="phone-vol-up"></div>
      <div class="phone-vol-down"></div>
      <div class="screen">
        <div class="di"></div>
        <div class="app">
          <div class="ring ring1"></div>
          <div class="ring ring2"></div>
          <div class="ring ring3"></div>
          <div class="app-glow-center"></div>

          <div class="announce-block">
            <div class="up-circle">↑</div>
            <div class="level-up-label">Achievement</div>
            <div class="level-up-heading">LEVEL UP!</div>
            <div class="level-num">8</div>
            <div class="level-sub">You're on a roll,<br>new operations unlocked</div>
          </div>

          <div class="stats-row">
            <div class="stat-cell">
              <div class="stat-val green">12</div>
              <div class="stat-lbl">Correct</div>
            </div>
            <div class="stat-cell">
              <div class="stat-val cyan">2.1s</div>
              <div class="stat-lbl">Avg Speed</div>
            </div>
            <div class="stat-cell">
              <div class="stat-val yellow">×4</div>
              <div class="stat-lbl">Streak</div>
            </div>
          </div>

          <div class="unlock-badge">
            <span class="unlock-icon">✕</span>
            <span class="unlock-text">Multiplication unlocked</span>
          </div>

          <div class="progress-section">
            <div class="progress-header">
              <div class="progress-lbl">Progress to Level 9</div>
              <div class="progress-pct">15%</div>
            </div>
            <div class="progress-track">
              <div class="progress-fill"></div>
            </div>
          </div>

          <div class="spacer"></div>

          <div class="continue-btn">CONTINUE →</div>
          <div class="home-ind"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="bottom">
    <div class="bottom-line"></div>
    <div class="tagline">The math game that gets smarter as you do</div>
  </div>
</div>
</body>
</html>
