<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MathFlux · Promo 2</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 660px; height: 1434px; overflow: hidden; background: #080e1c; font-family: -apple-system, system-ui, sans-serif; }
.canvas { width: 660px; height: 1434px; overflow: hidden; background: #080e1c; display: flex; flex-direction: column; align-items: center; position: relative; }
.bg-tl { position: absolute; top: -140px; left: -140px; width: 560px; height: 560px; background: radial-gradient(circle, rgba(249,115,22,0.18) 0%, transparent 65%); z-index: 0; }
.bg-br { position: absolute; bottom: -140px; right: -140px; width: 560px; height: 560px; background: radial-gradient(circle, rgba(250,204,21,0.15) 0%, transparent 65%); z-index: 0; }
.bg-grid { position: absolute; inset: 0; z-index: 0; opacity: 0.028; background-image: linear-gradient(rgba(250,204,21,1) 1px, transparent 1px), linear-gradient(90deg, rgba(250,204,21,1) 1px, transparent 1px); background-size: 40px 40px; }

.top { width: 100%; padding: 52px 48px 0; display: flex; flex-direction: column; align-items: center; flex-shrink: 0; position: relative; z-index: 1; }
.badge { display: flex; align-items: center; gap: 8px; background: rgba(0,212,232,0.1); border: 1px solid rgba(0,212,232,0.28); border-radius: 24px; padding: 7px 18px; margin-bottom: 18px; }
.badge-text { font-size: 11px; font-weight: 800; letter-spacing: 4px; color: #00d4e8; text-transform: uppercase; }
.headline { font-size: 40px; font-weight: 800; color: #fff; text-align: center; line-height: 1.14; letter-spacing: -1px; }
.hl { color: #facc15; }

.device-wrap { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; z-index: 1; }
.phone { width: 500px; height: 1020px; position: relative; background: linear-gradient(155deg, #2a2a30, #1c1c22 45%, #121216); border-radius: 60px; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.13), 0 0 0 1.5px #020205, 0 0 0 3.5px rgba(255,255,255,0.04), 0 50px 120px rgba(0,0,0,0.92), 0 0 120px rgba(249,115,22,0.1); }
.phone-power { position: absolute; right: -4px; top: 260px; width: 4px; height: 80px; background: #252530; border-radius: 0 4px 4px 0; }
.phone-silent { position: absolute; left: -4px; top: 170px; width: 4px; height: 34px; background: #252530; border-radius: 4px 0 0 4px; }
.phone-vol-up { position: absolute; left: -4px; top: 224px; width: 4px; height: 54px; background: #252530; border-radius: 4px 0 0 4px; }
.phone-vol-down { position: absolute; left: -4px; top: 296px; width: 4px; height: 54px; background: #252530; border-radius: 4px 0 0 4px; }
.screen { position: absolute; top: 14px; left: 14px; right: 14px; bottom: 14px; border-radius: 48px; overflow: hidden; }
.di { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); width: 140px; height: 38px; background: #000; border-radius: 19px; z-index: 50; }
.screen img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; }

.bottom { width: 100%; flex-shrink: 0; position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; padding: 20px 48px 48px; }
.bottom-line { width: 60px; height: 2px; background: linear-gradient(90deg, transparent, rgba(250,204,21,0.6), transparent); margin-bottom: 14px; }
.tagline { font-size: 13px; color: rgba(255,255,255,0.38); letter-spacing: 0.4px; text-align: center; font-style: normal; }
</style>
</head>
<body>
<div class="canvas">
  <div class="bg-tl"></div><div class="bg-br"></div><div class="bg-grid"></div>
  <div class="top">
    <div class="badge"><span style="display:inline-flex"><svg width="13" height="13" viewBox="0 0 24 24" fill="#00d4e8" style="display:block"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/></svg></span>&nbsp;<span class="badge-text">MathFlux</span></div>
    <div class="headline">Answer Fast.<br><span class="hl">Score Big.</span></div>
  </div>
  <div class="device-wrap">
    <div class="phone">
      <div class="phone-power"></div><div class="phone-silent"></div><div class="phone-vol-up"></div><div class="phone-vol-down"></div>
      <div class="screen">
        <div class="di"></div>
        <img src="screenshots/Simulator Screenshot - iPhone 17 Pro Max - 2026-05-12 at 19.49.50.png" alt="">
      </div>
    </div>
  </div>
  <div class="bottom">
    <div class="bottom-line"></div>
    <div class="tagline">The math game that gets smarter as you do</div>
  </div>
</div>
</body>
</html>
