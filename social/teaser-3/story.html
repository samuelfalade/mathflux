<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{width:1080px;height:1920px;overflow:hidden;background:#04080f;font-family:'Arial',sans-serif;}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(34,211,238,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(34,211,238,.05) 1px,transparent 1px);background-size:54px 54px;}
.glow-l{position:absolute;left:-100px;top:45%;transform:translateY(-50%);width:700px;height:700px;border-radius:50%;background:radial-gradient(circle,rgba(34,211,238,.1) 0%,transparent 65%);}
.glow-r{position:absolute;right:-100px;top:45%;transform:translateY(-50%);width:700px;height:700px;border-radius:50%;background:radial-gradient(circle,rgba(167,139,250,.09) 0%,transparent 65%);}

.top{position:absolute;top:120px;left:0;right:0;text-align:center;}
.label{font-size:16px;letter-spacing:.3em;text-transform:uppercase;color:#22d3ee;}

.center{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);width:100%;display:flex;flex-direction:column;align-items:center;gap:50px;padding:0 70px;}

.players{display:flex;align-items:center;gap:0;width:100%;}
.player{flex:1;display:flex;flex-direction:column;align-items:center;gap:20px;padding:50px 30px;background:rgba(10,22,40,.8);border-radius:24px;border:1px solid rgba(34,211,238,.12);}
.player.winning{border-color:rgba(34,211,238,.4);box-shadow:0 0 60px rgba(34,211,238,.1);}
.player-icon{font-size:56px;}
.player-name{font-size:22px;font-weight:700;color:#94a3b8;}
.player-score{font-family:'Courier New',monospace;font-size:60px;font-weight:700;color:#22d3ee;}
.player-score.losing{color:#334155;}
.vs-badge{width:80px;height:80px;border-radius:50%;background:#04080f;border:2px solid rgba(34,211,238,.3);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;color:#22d3ee;flex-shrink:0;}

.headline{font-size:80px;font-weight:900;letter-spacing:-.04em;color:#f0f6ff;text-align:center;line-height:1;}
.headline span{color:#22d3ee;text-shadow:0 0 40px rgba(34,211,238,.4);}
.sub{font-size:20px;color:#475569;letter-spacing:.1em;text-transform:uppercase;text-align:center;}

.bottom{position:absolute;bottom:100px;left:0;right:0;text-align:center;}
.brand-name{font-size:36px;font-weight:900;color:#f0f6ff;}
.brand-name span{color:#22d3ee;}
.site{font-family:'Courier New',monospace;font-size:16px;color:#334155;margin-top:8px;}
</style>
</head>
<body>
<div class="grid"></div>
<div class="glow-l"></div>
<div class="glow-r"></div>
<div class="top"><div class="label">Real players · Real stakes</div></div>
<div class="center">
  <div class="players">
    <div class="player winning">
      <div class="player-icon">🧠</div>
      <div class="player-name">Samuel</div>
      <div class="player-score">2,840</div>
    </div>
    <div class="vs-badge">VS</div>
    <div class="player">
      <div class="player-icon">🎒</div>
      <div class="player-name">Alex</div>
      <div class="player-score losing">2,210</div>
    </div>
  </div>
  <div class="headline">Real<br><span>Competition.</span><br>No Bots.</div>
  <div class="sub">Create a room · Challenge anyone</div>
</div>
<div class="bottom">
  <div class="brand-name">Math<span>Flux</span></div>
  <div class="site">Coming to App Store</div>
</div>
</body>
</html>
