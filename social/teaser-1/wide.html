<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{width:1200px;height:675px;overflow:hidden;background:#04080f;font-family:'Arial',sans-serif;}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(34,211,238,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(34,211,238,.06) 1px,transparent 1px);background-size:40px 40px;}
.glow{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:800px;height:600px;border-radius:50%;background:radial-gradient(ellipse,rgba(34,211,238,.1) 0%,transparent 65%);}
.content{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:60px;}
.bolt{font-size:120px;filter:drop-shadow(0 0 40px rgba(34,211,238,.6));}
.text{display:flex;flex-direction:column;gap:16px;}
.coming{font-size:14px;letter-spacing:.3em;text-transform:uppercase;color:#22d3ee;}
.title{font-size:86px;font-weight:900;letter-spacing:-.04em;color:#f0f6ff;line-height:.95;}
.title span{color:#22d3ee;text-shadow:0 0 40px rgba(34,211,238,.4);}
.sub{font-size:18px;color:#475569;letter-spacing:.1em;text-transform:uppercase;}
</style>
</head>
<body>
<div class="grid"></div>
<div class="glow"></div>
<div class="content">
  <div class="bolt">⚡</div>
  <div class="text">
    <div class="coming">Something is coming</div>
    <div class="title">Math<span>Flux</span></div>
    <div class="sub">Real-time math battles · Any level</div>
  </div>
</div>
</body>
</html>
