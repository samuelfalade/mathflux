<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{width:1080px;height:1080px;overflow:hidden;background:#04080f;font-family:'Arial',sans-serif;}

.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(34,211,238,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(34,211,238,.06) 1px,transparent 1px);background-size:54px 54px;}

.glow{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:800px;height:800px;border-radius:50%;background:radial-gradient(circle,rgba(34,211,238,.1) 0%,transparent 65%);}

.ring{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:500px;height:500px;border-radius:50%;border:1px solid rgba(34,211,238,.15);}
.ring2{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:700px;height:700px;border-radius:50%;border:1px solid rgba(34,211,238,.07);}

.content{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:32px;}

.bolt{font-size:120px;line-height:1;filter:drop-shadow(0 0 40px rgba(34,211,238,.6));}

.coming{font-size:15px;letter-spacing:.3em;text-transform:uppercase;color:#22d3ee;}

.title{font-size:80px;font-weight:900;letter-spacing:-.04em;color:#f0f6ff;text-align:center;line-height:1;}
.title span{color:#22d3ee;text-shadow:0 0 40px rgba(34,211,238,.4);}

.sub{font-size:20px;color:#475569;letter-spacing:.12em;text-transform:uppercase;text-align:center;}

.line{width:80px;height:2px;background:linear-gradient(to right,transparent,#22d3ee,transparent);}

.bottom{position:absolute;bottom:60px;left:0;right:0;text-align:center;}
.site{font-family:'Courier New',monospace;font-size:15px;color:#334155;letter-spacing:.08em;}
</style>
</head>
<body>
<div class="grid"></div>
<div class="glow"></div>
<div class="ring"></div>
<div class="ring2"></div>
<div class="content">
  <div class="coming">Something is coming</div>
  <div class="bolt">⚡</div>
  <div class="title">Math<span>Flux</span></div>
  <div class="line"></div>
  <div class="sub">Real-time math battles · Any level</div>
</div>
<div class="bottom">
  <div class="site">samuelfalade.github.io/mathflux</div>
</div>
</body>
</html>
