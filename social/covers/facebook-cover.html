<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{width:1640px;height:624px;overflow:hidden;background:#04080f;font-family:'Arial',sans-serif;}

.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(34,211,238,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(34,211,238,.05) 1px,transparent 1px);background-size:48px 48px;}

.glow-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:700px;height:500px;border-radius:50%;background:radial-gradient(ellipse,rgba(34,211,238,.12) 0%,transparent 65%);}
.glow-bl{position:absolute;left:-50px;bottom:-50px;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(99,102,241,.1) 0%,transparent 70%);}
.glow-tr{position:absolute;right:50px;top:-50px;width:350px;height:350px;border-radius:50%;background:radial-gradient(circle,rgba(251,191,36,.1) 0%,transparent 70%);}

/* Floating math */
.floats{position:absolute;inset:0;overflow:hidden;}
.f{position:absolute;font-family:'Courier New',monospace;color:rgba(34,211,238,.07);font-size:22px;}

.content{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;}

.badge{display:inline-flex;align-items:center;gap:8px;padding:6px 18px;border:1px solid rgba(34,211,238,.25);border-radius:100px;font-size:13px;color:#22d3ee;letter-spacing:.1em;text-transform:uppercase;background:rgba(34,211,238,.06);}
.badge::before{content:'';width:7px;height:7px;border-radius:50%;background:#22d3ee;box-shadow:0 0 8px #22d3ee;}

.logo{font-size:96px;font-weight:900;letter-spacing:-.04em;color:#f0f6ff;line-height:1;}
.logo span{color:#22d3ee;text-shadow:0 0 40px rgba(34,211,238,.5);}

.tagline{font-size:22px;color:#64748b;letter-spacing:.15em;text-transform:uppercase;font-weight:400;}

.pills{display:flex;gap:16px;margin-top:8px;}
.pill{padding:8px 20px;border-radius:100px;font-size:14px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;}
.pill-1{background:rgba(34,211,238,.15);color:#22d3ee;border:1px solid rgba(34,211,238,.3);}
.pill-2{background:rgba(251,191,36,.12);color:#fbbf24;border:1px solid rgba(251,191,36,.3);}
.pill-3{background:rgba(167,139,250,.12);color:#a78bfa;border:1px solid rgba(167,139,250,.3);}
</style>
</head>
<body>
<div class="grid"></div>
<div class="glow-center"></div>
<div class="glow-bl"></div>
<div class="glow-tr"></div>
<div class="floats">
  <span class="f" style="left:80px;top:80px">12×14</span>
  <span class="f" style="left:180px;bottom:100px">∑n²</span>
  <span class="f" style="right:100px;top:100px">d/dx(x³)</span>
  <span class="f" style="right:200px;bottom:80px">47 mod 5</span>
  <span class="f" style="left:400px;top:50px">√256</span>
  <span class="f" style="right:400px;bottom:50px">8!</span>
  <span class="f" style="left:100px;top:50%;transform:translateY(-50%)">x²+3x</span>
  <span class="f" style="right:80px;top:50%;transform:translateY(-50%)">∫₀¹</span>
</div>
<div class="content">
  <div class="badge">Now on App Store</div>
  <div class="logo">Math<span>Flux</span></div>
  <div class="tagline">Math Battles · Any Level</div>
  <div class="pills">
    <div class="pill pill-1">Real-time Multiplayer</div>
    <div class="pill pill-2">5 Difficulty Modes</div>
    <div class="pill pill-3">iOS 26</div>
  </div>
</div>
</body>
</html>
