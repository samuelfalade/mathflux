<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{width:1200px;height:675px;overflow:hidden;background:#04080f;font-family:'Arial',sans-serif;}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(34,211,238,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(34,211,238,.06) 1px,transparent 1px);background-size:40px 40px;}
.glow{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:900px;height:700px;border-radius:50%;background:radial-gradient(ellipse,rgba(34,211,238,.12) 0%,transparent 60%);}
.content{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:70px;padding:0 80px;}
.left{display:flex;flex-direction:column;gap:20px;}
.live-badge{display:inline-flex;align-items:center;gap:8px;padding:6px 18px;border-radius:100px;background:rgba(34,211,238,.12);border:1px solid rgba(34,211,238,.3);font-size:13px;font-weight:700;color:#22d3ee;letter-spacing:.12em;text-transform:uppercase;align-self:flex-start;}
.live-dot{width:7px;height:7px;border-radius:50%;background:#22d3ee;box-shadow:0 0 8px #22d3ee;}
.title{font-size:90px;font-weight:900;letter-spacing:-.04em;color:#f0f6ff;line-height:.9;}
.title span{color:#22d3ee;}
.tagline{font-size:18px;color:#475569;letter-spacing:.1em;text-transform:uppercase;}
.right{display:flex;flex-direction:column;gap:20px;align-items:flex-start;}
.pills{display:flex;flex-direction:column;gap:12px;}
.pill{padding:12px 24px;border-radius:100px;font-size:15px;font-weight:600;letter-spacing:.04em;}
.p1{background:rgba(34,211,238,.1);color:#22d3ee;border:1px solid rgba(34,211,238,.25);}
.p2{background:rgba(251,191,36,.1);color:#fbbf24;border:1px solid rgba(251,191,36,.25);}
.p3{background:rgba(74,222,128,.1);color:#4ade80;border:1px solid rgba(74,222,128,.25);}
.dl-btn{padding:18px 44px;border-radius:100px;background:#22d3ee;color:#04080f;font-size:17px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;box-shadow:0 0 40px rgba(34,211,238,.35);margin-top:8px;}
</style>
</head>
<body>
<div class="grid"></div>
<div class="glow"></div>
<div class="content">
  <div class="left">
    <div class="live-badge"><div class="live-dot"></div>Now Live</div>
    <div class="title">Math<span>Flux</span></div>
    <div class="tagline">Math Battles · Any Level</div>
  </div>
  <div class="right">
    <div class="pills">
      <div class="pill p1">Real-time Multiplayer</div>
      <div class="pill p2">5 Difficulty Modes</div>
      <div class="pill p3">Free to Play</div>
    </div>
    <div class="dl-btn">Download Free</div>
  </div>
</div>
</body>
</html>
