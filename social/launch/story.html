<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{width:1080px;height:1920px;overflow:hidden;background:#04080f;font-family:'Arial',sans-serif;}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(34,211,238,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(34,211,238,.06) 1px,transparent 1px);background-size:54px 54px;}
.glow{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:1100px;height:1100px;border-radius:50%;background:radial-gradient(circle,rgba(34,211,238,.13) 0%,transparent 60%);}
.ring1{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:660px;height:660px;border-radius:50%;border:1px solid rgba(34,211,238,.2);}
.ring2{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:880px;height:880px;border-radius:50%;border:1px solid rgba(34,211,238,.08);}

.top{position:absolute;top:120px;left:0;right:0;text-align:center;}
.live-badge{display:inline-flex;align-items:center;gap:10px;padding:8px 24px;border-radius:100px;background:rgba(34,211,238,.12);border:1px solid rgba(34,211,238,.35);font-size:15px;font-weight:700;color:#22d3ee;letter-spacing:.15em;text-transform:uppercase;}
.live-dot{width:8px;height:8px;border-radius:50%;background:#22d3ee;box-shadow:0 0 10px #22d3ee;}

.center{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:100%;text-align:center;display:flex;flex-direction:column;align-items:center;gap:30px;}
.bolt{font-size:160px;filter:drop-shadow(0 0 60px rgba(34,211,238,.7));line-height:1;}
.title{font-size:110px;font-weight:900;letter-spacing:-.04em;color:#f0f6ff;line-height:.9;}
.title span{color:#22d3ee;text-shadow:0 0 60px rgba(34,211,238,.5);}
.tagline{font-size:24px;color:#64748b;letter-spacing:.1em;text-transform:uppercase;}
.divider{width:60px;height:2px;background:linear-gradient(to right,transparent,#22d3ee,transparent);}
.pills{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;padding:0 80px;}
.pill{padding:10px 24px;border-radius:100px;font-size:15px;font-weight:600;letter-spacing:.04em;}
.p1{background:rgba(34,211,238,.1);color:#22d3ee;border:1px solid rgba(34,211,238,.25);}
.p2{background:rgba(251,191,36,.1);color:#fbbf24;border:1px solid rgba(251,191,36,.25);}
.p3{background:rgba(74,222,128,.1);color:#4ade80;border:1px solid rgba(74,222,128,.25);}

.bottom{position:absolute;bottom:100px;left:0;right:0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px;}
.dl-btn{padding:22px 70px;border-radius:100px;background:#22d3ee;color:#04080f;font-size:20px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;box-shadow:0 0 60px rgba(34,211,238,.4);}
.store{font-size:15px;color:#334155;letter-spacing:.08em;text-transform:uppercase;}
</style>
</head>
<body>
<div class="grid"></div>
<div class="glow"></div>
<div class="ring1"></div>
<div class="ring2"></div>
<div class="top"><div class="live-badge"><div class="live-dot"></div>Now Live on App Store</div></div>
<div class="center">
  <div class="bolt">⚡</div>
  <div class="title">Math<span>Flux</span></div>
  <div class="tagline">Math Battles · Any Level</div>
  <div class="divider"></div>
  <div class="pills">
    <div class="pill p1">Real Multiplayer</div>
    <div class="pill p2">5 Modes</div>
    <div class="pill p3">Free</div>
  </div>
</div>
<div class="bottom">
  <div class="dl-btn">Download Free</div>
  <div class="store">Available on iPhone · iOS 26</div>
</div>
</body>
</html>
