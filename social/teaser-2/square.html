<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{width:1080px;height:1080px;overflow:hidden;background:#04080f;font-family:'Arial',sans-serif;}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(34,211,238,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(34,211,238,.05) 1px,transparent 1px);background-size:54px 54px;}
.glow{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(251,191,36,.1) 0%,transparent 65%);}

/* Timer arc */
.timer-ring{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);}

.content{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;}

.label{font-size:14px;letter-spacing:.3em;text-transform:uppercase;color:#fbbf24;}

/* Problem card */
.card{background:rgba(10,22,40,.8);border:1px solid rgba(34,211,238,.2);border-radius:24px;padding:50px 70px;text-align:center;backdrop-filter:blur(10px);box-shadow:0 0 60px rgba(34,211,238,.08);}
.problem{font-family:'Courier New',monospace;font-size:72px;font-weight:700;color:#f0f6ff;letter-spacing:-.02em;}
.problem span{color:#22d3ee;}

/* Timer bar */
.timer-wrap{width:400px;}
.timer-label{display:flex;justify-content:space-between;font-size:13px;color:#475569;letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px;}
.timer-track{height:6px;background:rgba(255,255,255,.08);border-radius:100px;overflow:hidden;}
.timer-fill{height:100%;width:35%;background:linear-gradient(to right,#fbbf24,#f97316);border-radius:100px;box-shadow:0 0 12px rgba(251,191,36,.6);}

.think{font-size:52px;font-weight:900;letter-spacing:-.03em;color:#f0f6ff;text-align:center;}
.think span{color:#fbbf24;}

.sub{font-size:18px;color:#475569;letter-spacing:.1em;text-transform:uppercase;}

.brand{position:absolute;bottom:60px;left:0;right:0;text-align:center;}
.brand-name{font-size:28px;font-weight:900;letter-spacing:-.03em;color:#f0f6ff;}
.brand-name span{color:#22d3ee;}
</style>
</head>
<body>
<div class="grid"></div>
<div class="glow"></div>
<div class="content">
  <div class="label">Can you answer in time?</div>
  <div class="card">
    <div class="problem">47 <span>+</span> 38 = ?</div>
  </div>
  <div class="timer-wrap">
    <div class="timer-label"><span>Time remaining</span><span>1.8s</span></div>
    <div class="timer-track"><div class="timer-fill"></div></div>
  </div>
  <div class="think">Think <span>Fast.</span></div>
  <div class="sub">MathFlux · Coming to App Store</div>
</div>
<div class="brand"><div class="brand-name">Math<span>Flux</span></div></div>
</body>
</html>
