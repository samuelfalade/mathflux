<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{width:1200px;height:675px;overflow:hidden;background:#04080f;font-family:'Arial',sans-serif;}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(34,211,238,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(34,211,238,.05) 1px,transparent 1px);background-size:40px 40px;}
.glow{position:absolute;right:200px;top:50%;transform:translateY(-50%);width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(251,191,36,.1) 0%,transparent 65%);}
.content{position:absolute;inset:0;display:flex;align-items:center;padding:0 90px;gap:80px;}
.left{display:flex;flex-direction:column;gap:20px;flex:1;}
.label{font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:#fbbf24;}
.think{font-size:80px;font-weight:900;letter-spacing:-.04em;color:#f0f6ff;line-height:.95;}
.think span{color:#fbbf24;}
.sub{font-size:16px;color:#475569;letter-spacing:.1em;text-transform:uppercase;}
.right{display:flex;flex-direction:column;gap:20px;align-items:center;}
.card{background:rgba(10,22,40,.9);border:1px solid rgba(34,211,238,.2);border-radius:20px;padding:40px 56px;text-align:center;box-shadow:0 0 50px rgba(34,211,238,.08);}
.problem{font-family:'Courier New',monospace;font-size:64px;font-weight:700;color:#f0f6ff;}
.problem span{color:#22d3ee;}
.timer-track{width:320px;height:6px;background:rgba(255,255,255,.08);border-radius:100px;overflow:hidden;}
.timer-fill{height:100%;width:30%;background:linear-gradient(to right,#fbbf24,#f97316);border-radius:100px;}
</style>
</head>
<body>
<div class="grid"></div>
<div class="glow"></div>
<div class="content">
  <div class="left">
    <div class="label">Can you answer in time?</div>
    <div class="think">Think<br><span>Fast.</span></div>
    <div class="sub">MathFlux · Coming to App Store</div>
  </div>
  <div class="right">
    <div class="card"><div class="problem">47 <span>+</span> 38 = ?</div></div>
    <div class="timer-track"><div class="timer-fill"></div></div>
  </div>
</div>
</body>
</html>
